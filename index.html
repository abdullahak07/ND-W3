<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>COMP6012 Week 3 · Loading Interactive Module</title>
<style>
html,body{height:100%;margin:0;background:#050a12;color:#eef8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,rgba(157,113,255,.2),transparent 35%),radial-gradient(circle at 20% 80%,rgba(44,224,184,.12),transparent 32%),#050a12}.loader{text-align:center;width:min(520px,86vw)}.orb{width:78px;height:78px;margin:0 auto 24px;border:3px solid rgba(55,215,255,.18);border-top-color:#37d7ff;border-right-color:#9d71ff;border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 45px rgba(55,215,255,.16)}h1{font-size:clamp(1.4rem,4vw,2.1rem);margin:0 0 9px}p{color:#9eb3c9;margin:0}.bar{height:5px;margin-top:24px;background:#10233a;border-radius:99px;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:45%;background:linear-gradient(90deg,#2ce0b8,#37d7ff,#9d71ff);animation:load 1.2s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(240%)}}.error{color:#ff8b96;margin-top:18px;font-size:.9rem;display:none}
</style>
</head>
<body>
<div class="loader"><div class="orb"></div><h1>Loading the animated Week 3 lab</h1><p>Preparing CTI framework visualisations, games, and the Kali installer simulator…</p><div class="bar"></div><div class="error" id="error"></div></div>
<script>
(async()=>{
  try{
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    const paths=['./payload/rich_site_1.b64','./payload/rich_site_gap.b64','./payload/rich_site.b64'];
    const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
    responses.forEach((response,index)=>{if(!response.ok) throw new Error(`Website payload part ${index+1} could not be loaded (${response.status}).`)});
    const encoded=(await Promise.all(responses.map(response=>response.text()))).map(text=>text.trim()).join('');
    if(!encoded.startsWith('H4sI')) throw new Error('The animated website payload is incomplete.');
    const binary=atob(encoded);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('Please open the site in an up-to-date Chrome, Edge, Firefox, or Safari browser.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('17 visual interactions')||!html.includes('@keyframes')||!html.includes('IntersectionObserver')) throw new Error('The animated website payload failed validation.');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const box=document.getElementById('error');
    box.style.display='block';
    box.textContent=err.message+' Refresh the page once Vercel has finished redeploying.';
  }
})();
</script>
</body>
</html>
