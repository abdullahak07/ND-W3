name: restore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate animated website files
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html
          test -s payload/rich_site_1.b64
          test -s payload/rich_site_gap.b64
          test -s payload/rich_site.b64

          grep -q "rich_site_1.b64" index.html
          grep -q "rich_site_gap.b64" index.html
          grep -q "rich_site.b64" index.html
          grep -q "DecompressionStream" index.html

          echo "Animated Week 3 website payload is present and correctly referenced."
