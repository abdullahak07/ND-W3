name: Fix initial auto-scroll

on:
  push:
    paths:
      - '.github/workflows/fix-autoscroll.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prevent installer navigation from scrolling the page
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "steps.children[si].scrollIntoView({block:'nearest'})"
          new = "steps.scrollTop=Math.max(0,steps.children[si].offsetTop-steps.offsetTop-steps.clientHeight/2)"

          if old not in text:
              raise SystemExit("Expected auto-scroll code was not found; no file was changed.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit the fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix website opening at installer section"
          git push
